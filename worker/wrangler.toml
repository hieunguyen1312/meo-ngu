name = "meo-ngu"
main = "src/index.js"
compatibility_date = "2025-08-15"

[vars]
ALLOWED_ORIGINS = "https://hieunguyen1312.github.io,http://localhost:8080"
# Agent providers, tried in order. One question stays on one provider; failures fall through.
AGENT_PROVIDERS = "gemini,workersai,anthropic"
GEMINI_MODEL = "gemini-3.1-flash-lite"
WORKERS_AI_MODEL = "@cf/google/gemma-4-26b-a4b-it"
AGENT_MODEL = "claude-haiku-5-5"
AGENT_DAILY_LIMIT = "10"
# Secrets (never commit), set in the dashboard or with `npx wrangler secret put`:
#   GEMINI_API_KEY     free key from https://aistudio.google.com/apikey
#   ANTHROPIC_API_KEY  optional paid fallback

[ai]
binding = "AI"

[[d1_databases]]
binding = "DB"
database_name = "meo-ngu"
database_id = "fb149aa9-5852-4252-99dd-4f4cda2465bf"

# Optional: raw audio that owners choose to share. Uncomment after creating the bucket.
# [[r2_buckets]]
# binding = "AUDIO"
# bucket_name = "meo-ngu-audio"

[observability]
enabled = true
